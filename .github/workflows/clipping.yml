name: Clipping xenotrasplantes

on:
  schedule:
    # Lunes 11:00 UTC = 7:00 en Chile (horario de invierno).
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install feedparser anthropic reportlab

      - name: Generar el informe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PATENTSVIEW_API_KEY: ${{ secrets.PATENTSVIEW_API_KEY }}
        run: python xeno_clipping.py

      - name: Guardar el informe y la memoria en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add salida/
          git diff --staged --quiet || git commit -m "Clipping xenotrasplantes $(date +%F)"
          git push